services:
  dashboard_backend:
    container_name: dashboard_backend
    build: ./backend
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/.env:ro
      - ./manifest.yml:/app/manifest.yml:ro
      - ./data:/data
      # Mount apps directrory for inventory sync and ops scripts
      - /home/munaim/srv/apps:/home/munaim/srv/apps
      # Mount ops logs directory (RW)
      - /home/munaim/srv/ops/logs:/home/munaim/srv/ops/logs
      # Mount Caddyfile for domain scanning (RO)
      - /home/munaim/srv/proxy/caddy/Caddyfile:/home/munaim/srv/proxy/caddy/Caddyfile:ro
      # Read-only host mounts for host-level summary metrics.
      - /:/host:ro
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000"

  dashboard_frontend:
    container_name: dashboard_frontend
    build: ./frontend
    ports:
      - "127.0.0.1:8013:80"
    depends_on:
      - dashboard_backend
    restart: unless-stopped
